name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install buildozer & cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Pre-fetch freetype (Savannah mirror is unreliable on CI)
        run: |
          DEST="$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype"
          mkdir -p "$DEST"
          cd "$DEST"
          curl -L --fail --retry 5 --retry-delay 5 -o freetype-2.14.1.tar.gz \
            https://distfiles.gentoo.org/distfiles/freetype-2.14.1.tar.gz \
          || curl -L --fail --retry 5 --retry-delay 5 -o freetype-2.14.1.tar.gz \
            https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz
          ls -la

      - name: Use local reportlab recipe (hg.reportlab.com blocks CI downloads)
        run: |
          sed -i '/^requirements = /a p4a.local_recipes = '"$GITHUB_WORKSPACE"'/p4a-recipes' buildozer.spec
          echo "---- buildozer.spec ----"
          cat buildozer.spec

      - name: Build APK with buildozer
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 120
          command: yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: medicine-scanner-apk
          path: bin/*.apk
